
name: Build MinixxsClippy iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          bindings: vwtfafa/bindings
          bindings-ref: fix/2.2081-depends

      - name: Upload GEODE file
        uses: actions/upload-artifact@v7
        with:
          name: MinixxsClippy-iOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
